<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Toyota hybrides d'occasion</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#14171c; --dim:#666e7a; --line:#e3e6ea;
  --accent:#c8102e; --good:#0a7d3f; --goodbg:#e6f4ec; --chip:#eef0f3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317; --card:#191c22; --fg:#e8eaed; --dim:#98a0ab; --line:#2a2f38;
  --accent:#ff5a6e; --good:#4ade80; --goodbg:#12301f; --chip:#232833;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--card);
  border-bottom:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));
  padding-top:calc(10px + env(safe-area-inset-top,0))}
h1{margin:0 0 2px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.sub{font-size:11.5px;color:var(--dim)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.controls .wide{grid-column:1/-1}
select,input{width:100%;padding:8px 9px;font-size:14px;font-family:inherit;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;
  -webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.count{font-size:11.5px;color:var(--dim);margin-top:7px;display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.reset{color:var(--accent);cursor:pointer;text-decoration:underline;flex:none}
main{padding:10px 12px 40px;display:flex;flex-direction:column;gap:8px}
a.car{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;text-decoration:none;color:inherit}
a.car:active{transform:scale(.995)}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.deal .price{color:var(--good)}
.name{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vers{color:var(--dim);font-size:12.5px;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--dim)}
.badge{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:650}
.new{background:var(--accent);color:#fff}
.drop{background:var(--goodbg);color:var(--good)}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
footer{text-align:center;color:var(--dim);font-size:11px;padding:0 20px 30px}
</style>
</head>
<body>
<header>
  <h1>Toyota &amp; Lexus hybrides</h1>
  <div class="sub" id="sub"></div>
  <div class="controls">
    <input class="wide" type="search" id="q" placeholder="Rechercher (modèle, ville, concession…)">
    <select id="model"></select>
    <select id="region"></select>
    <select id="maxp">
      <option value="">Prix max</option>
      <option>16000</option><option>18000</option><option>20000</option>
      <option>22000</option><option>25000</option><option>30000</option><option>40000</option>
    </select>
    <select id="maxk">
      <option value="">Km max</option>
      <option>20000</option><option>50000</option><option>80000</option>
      <option>120000</option><option>160000</option>
    </select>
    <select class="wide" id="sort">
      <option value="price">Prix croissant</option>
      <option value="-price">Prix décroissant</option>
      <option value="km">Kilométrage croissant</option>
      <option value="-first">Vues récemment en premier</option>
      <option value="-year">Année récente en premier</option>
    </select>
  </div>
  <div class="count"><span id="count"></span><span class="reset" id="reset">réinitialiser</span></div>
</header>
<main id="list"></main>
<footer id="foot"></footer>

<script>
const DATA = __DATA__;
const UPDATED = "__UPDATED__";
const ALERT = __ALERT__;

const $ = s => document.querySelector(s);
const nb = n => n == null ? "?" : n.toLocaleString("fr-FR");
const eur = n => n == null ? "?" : nb(n) + " €";

// "Vu recemment" : premiere apparition dans notre suivi, pas date de publication
// (l'API Toyota n'expose aucune date de mise en ligne).
const DAY = 864e5, today = Date.now();
const daysAgo = d => d ? Math.floor((today - Date.parse(d)) / DAY) : 999;

function fillSelect(el, label, values){
  el.innerHTML = `<option value="">${label}</option>` +
    values.map(v => `<option>${v}</option>`).join("");
}
fillSelect($("#model"), "Tous les modèles",
  [...new Set(DATA.map(c => c.model))].filter(Boolean).sort());
fillSelect($("#region"), "Toute la France",
  [...new Set(DATA.map(c => c.reg))].filter(Boolean).sort());

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const model = $("#model").value, region = $("#region").value;
  const maxp = +$("#maxp").value || Infinity, maxk = +$("#maxk").value || Infinity;
  const sort = $("#sort").value;

  let rows = DATA.filter(c =>
    (!model  || c.model === model) &&
    (!region || c.reg === region) &&
    (c.price ?? Infinity) <= maxp &&
    (c.km ?? Infinity) <= maxk &&
    (!q || `${c.model} ${c.vers} ${c.city} ${c.deal} ${c.reg} ${c.color} ${c.year}`
             .toLowerCase().includes(q)));

  const dir = sort[0] === "-" ? -1 : 1, key = sort.replace("-", "");
  rows.sort((a, b) => {
    const va = key === "first" ? Date.parse(a.first || 0) : (a[key] ?? Infinity);
    const vb = key === "first" ? Date.parse(b.first || 0) : (b[key] ?? Infinity);
    return (va - vb) * dir || (a.price ?? 0) - (b.price ?? 0);
  });

  $("#count").textContent =
    `${nb(rows.length)} véhicule${rows.length > 1 ? "s" : ""}` +
    (rows.length ? ` · à partir de ${eur(Math.min(...rows.map(r => r.price ?? Infinity)))}` : "");

  $("#list").innerHTML = rows.length ? rows.map(c => {
    const isNew = !c.seeded && daysAgo(c.first) <= 3;
    const dropped = c.prev && c.price && c.prev > c.price;
    return `<a class="car ${c.price < ALERT ? "deal" : ""}" href="${c.url}" target="_blank" rel="noopener">
      <div class="row1">
        <div class="name">${c.model} <span style="color:var(--dim);font-weight:400">${c.year || ""}</span></div>
        <div class="price">${eur(c.price)}</div>
      </div>
      ${c.vers ? `<div class="vers">${c.vers}</div>` : ""}
      <div class="meta">
        ${isNew ? '<span class="badge new">NOUVEAU</span>' : ""}
        ${dropped ? `<span class="badge drop">−${eur(c.prev - c.price)}</span>` : ""}
        <span class="chip">${nb(c.km)} km</span>
        <span class="chip">${c.city || c.reg || "—"}</span>
        ${c.body ? `<span class="chip">${c.body}</span>` : ""}
        ${c.color ? `<span class="chip">${c.color}</span>` : ""}
      </div>
      <div class="vers" style="margin-top:5px">${c.deal || ""}</div>
    </a>`;
  }).join("") : `<div class="empty">Aucun véhicule ne correspond.</div>`;
}

["q","model","region","maxp","maxk","sort"].forEach(id =>
  $("#"+id).addEventListener("input", render));
$("#reset").addEventListener("click", () => {
  ["q","model","region","maxp","maxk"].forEach(id => $("#"+id).value = "");
  $("#sort").value = "price"; render();
});

$("#sub").textContent = `${nb(DATA.length)} annonces · mis à jour ` +
  new Date(UPDATED).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
$("#foot").textContent =
  "« NOUVEAU » = première apparition dans le suivi (l'API Toyota ne publie pas de date de mise en ligne). " +
  "Prix en vert : sous le seuil d'alerte de " + eur(ALERT) + ".";
render();
</script>
</body>
</html>
