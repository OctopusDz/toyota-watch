<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Toyota hybrides d'occasion</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#14171c; --dim:#666e7a; --line:#e3e6ea;
  --accent:#c8102e; --good:#0a7d3f; --goodbg:#e6f4ec; --chip:#eef0f3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317; --card:#191c22; --fg:#e8eaed; --dim:#98a0ab; --line:#2a2f38;
  --accent:#ff5a6e; --good:#4ade80; --goodbg:#12301f; --chip:#232833;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--card);
  border-bottom:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));
  padding-top:calc(10px + env(safe-area-inset-top,0))}
h1{margin:0 0 2px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#refresh{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 13px;
  border-radius:18px;border:1px solid var(--line);background:var(--chip);color:var(--fg);
  font-size:13.5px;font-weight:600;line-height:1;cursor:pointer;font-family:inherit;
  white-space:nowrap;-webkit-appearance:none;appearance:none}
#refresh:active{opacity:.6}
#ricon{display:inline-block;font-size:16px}
#refresh.busy #ricon{animation:sp .8s linear infinite}
#refresh.busy{color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}
#pull{height:0;overflow:hidden;text-align:center;color:var(--dim);font-size:12px;
  transition:height .15s}
#pull.on{height:26px;line-height:26px}
#toast{max-height:0;overflow:hidden;transition:max-height .2s;text-align:center;
  font-size:13px;font-weight:600}
#toast.on{max-height:40px}
#toast span{display:inline-block;margin:8px 12px 0;padding:6px 13px;border-radius:16px;
  background:var(--chip);color:var(--dim)}
#toast span.hit{background:var(--goodbg);color:var(--good)}
.sub{font-size:11.5px;color:var(--dim)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.controls .wide{grid-column:1/-1}
select,input{width:100%;padding:8px 9px;font-size:14px;font-family:inherit;
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;
  -webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.count{font-size:11.5px;color:var(--dim);margin-top:7px;display:flex;
  justify-content:space-between;align-items:center;gap:8px}
.reset{color:var(--accent);cursor:pointer;text-decoration:underline;flex:none}
main{padding:10px 12px 40px;display:flex;flex-direction:column;gap:8px}
a.car{display:block;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 12px;text-decoration:none;color:inherit}
a.car:active{transform:scale(.995)}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.deal .price{color:var(--good)}
.name{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vers{color:var(--dim);font-size:12.5px;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11.5px;color:var(--dim)}
.badge{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:650}
.new{background:var(--accent);color:#fff}
.drop{background:var(--goodbg);color:var(--good)}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
footer{text-align:center;color:var(--dim);font-size:11px;padding:0 20px 30px}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <div>
      <h1>Toyota &amp; Lexus hybrides</h1>
      <div class="sub" id="sub">Chargement…</div>
    </div>
    <button id="refresh" aria-label="Actualiser"><span id="ricon">↻</span> Actualiser</button>
  </div>
  <div class="controls">
    <input class="wide" type="search" id="q" placeholder="Rechercher (modèle, ville, concession…)">
    <select id="model"></select>
    <select id="region"></select>
    <select id="maxp">
      <option value="">Prix max</option>
      <option>16000</option><option>18000</option><option>20000</option>
      <option>22000</option><option>25000</option><option>30000</option><option>40000</option>
    </select>
    <select id="maxk">
      <option value="">Km max</option>
      <option>20000</option><option>50000</option><option>80000</option>
      <option>120000</option><option>160000</option>
    </select>
    <select id="minyear"></select>
    <select id="sort">
      <option value="price">Prix croissant</option>
      <option value="-price">Prix décroissant</option>
      <option value="km">Km croissant</option>
      <option value="-first">Vus récemment</option>
      <option value="-year">Année récente</option>
    </select>
  </div>
  <div class="count"><span id="count"></span><span class="reset" id="reset">réinitialiser</span></div>
</header>
<div id="pull">Relâche pour actualiser</div>
<div id="toast"></div>
<main id="list"></main>
<footer id="foot"></footer>

<script>
let DATA = [], UPDATED = "", ALERT = 20000;

const $ = s => document.querySelector(s);
const nb = n => n == null ? "?" : Math.round(n).toLocaleString("fr-FR");
const eur = n => n == null ? "?" : nb(n) + " €";

// "Vu recemment" : premiere apparition dans notre suivi, pas date de publication
// (l'API Toyota n'expose aucune date de mise en ligne).
const DAY = 864e5, today = Date.now();
const daysAgo = d => d ? Math.floor((today - Date.parse(d)) / DAY) : 999;

function fillSelect(el, label, values){
  const keep = el.value;
  el.innerHTML = `<option value="">${label}</option>` +
    values.map(v => `<option>${v}</option>`).join("");
  if (values.includes(keep)) el.value = keep;
}
function fillAll(){
  fillSelect($("#model"), "Tous les modèles",
    [...new Set(DATA.map(c => c.model))].filter(Boolean).sort());
  fillSelect($("#region"), "Toute la France",
    [...new Set(DATA.map(c => c.reg))].filter(Boolean).sort());
  fillSelect($("#minyear"), "Année min",
    [...new Set(DATA.map(c => c.year))].filter(Boolean).sort().reverse());
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  const model = $("#model").value, region = $("#region").value;
  const maxp = +$("#maxp").value || Infinity, maxk = +$("#maxk").value || Infinity;
  const minyear = +$("#minyear").value || 0;
  const sort = $("#sort").value;

  let rows = DATA.filter(c =>
    (!model  || c.model === model) &&
    (!region || c.reg === region) &&
    (c.price ?? Infinity) <= maxp &&
    (c.km ?? Infinity) <= maxk &&
    (+c.year || 0) >= minyear &&
    (!q || `${c.model} ${c.vers} ${c.city} ${c.deal} ${c.reg} ${c.color} ${c.year}`
             .toLowerCase().includes(q)));

  const dir = sort[0] === "-" ? -1 : 1, key = sort.replace("-", "");
  rows.sort((a, b) => {
    const va = key === "first" ? Date.parse(a.first || 0) : (a[key] ?? Infinity);
    const vb = key === "first" ? Date.parse(b.first || 0) : (b[key] ?? Infinity);
    return (va - vb) * dir || (a.price ?? 0) - (b.price ?? 0);
  });

  $("#count").textContent =
    `${nb(rows.length)} véhicule${rows.length > 1 ? "s" : ""}` +
    (rows.length ? ` · à partir de ${eur(Math.min(...rows.map(r => r.price ?? Infinity)))}` : "");

  $("#list").innerHTML = rows.length ? rows.map(c => {
    const isNew = !c.seeded && daysAgo(c.first) <= 3;
    const dropped = c.prev && c.price && c.prev > c.price;
    return `<a class="car ${c.price < ALERT ? "deal" : ""}" href="${c.url}" target="_blank" rel="noopener">
      <div class="row1">
        <div class="name">${c.model} <span style="color:var(--dim);font-weight:400">${c.year || ""}</span></div>
        <div class="price">${eur(c.price)}</div>
      </div>
      ${c.vers ? `<div class="vers">${c.vers}</div>` : ""}
      <div class="meta">
        ${isNew ? '<span class="badge new">NOUVEAU</span>' : ""}
        ${dropped ? `<span class="badge drop">−${eur(c.prev - c.price)}</span>` : ""}
        <span class="chip">${nb(c.km)} km</span>
        <span class="chip">${c.city || c.reg || "—"}</span>
        ${c.body ? `<span class="chip">${c.body}</span>` : ""}
        ${c.color ? `<span class="chip">${c.color}</span>` : ""}
      </div>
      <div class="vers" style="margin-top:5px">${c.deal || ""}</div>
    </a>`;
  }).join("") : `<div class="empty">Aucun véhicule ne correspond.</div>`;
}

["q","model","region","maxp","maxk","minyear","sort"].forEach(id =>
  $("#"+id).addEventListener("input", render));
$("#reset").addEventListener("click", () => {
  ["q","model","region","maxp","maxk","minyear"].forEach(id => $("#"+id).value = "");
  $("#sort").value = "price"; render();
});

// Le parametre anti-cache est indispensable : GitHub Pages sert les fichiers
// avec max-age=600, et une app ajoutee a l'ecran d'accueil les garde plus
// longtemps. Sans lui la page peut afficher un stock vieux de plusieurs heures.
let toastTimer = null;
function toast(msg, hit){
  const el = $("#toast");
  el.innerHTML = `<span class="${hit ? "hit" : ""}">${msg}</span>`;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 4000);
}

let loading = false;
async function load(force){
  if (loading) return;               // evite les rechargements superposes
  loading = true;
  lastLoad = Date.now();
  $("#refresh").classList.add("busy");
  const t0 = performance.now();
  $("#sub").textContent = "Actualisation…";
  try {
    const r = await fetch("cars.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const before = new Set(DATA.map(c => c.id));
    const prevPrices = new Map(DATA.map(c => [c.id, c.price]));
    DATA = j.cars; UPDATED = j.updated; ALERT = j.alert;
    fillAll();
    render();

    // Sans retour explicite, un rafraichissement sans nouveaute est
    // indiscernable d'un bouton casse : on annonce toujours le resultat.
    if (before.size) {
      const ajouts = DATA.filter(c => !before.has(c.id));
      const baisses = DATA.filter(c => prevPrices.has(c.id) && c.price < prevPrices.get(c.id));
      if (ajouts.length || baisses.length) {
        const bouts = [];
        if (ajouts.length) bouts.push(`${ajouts.length} nouvelle${ajouts.length > 1 ? "s" : ""}`);
        if (baisses.length) bouts.push(`${baisses.length} baisse${baisses.length > 1 ? "s" : ""} de prix`);
        toast("✓ " + bouts.join(" · "), true);
      } else {
        toast("✓ À jour — rien de nouveau");
      }
    }
    const d = new Date(UPDATED);
    const mins = Math.round((Date.now() - d) / 60000);
    const age = mins < 60 ? `il y a ${mins} min`
              : mins < 1440 ? `il y a ${Math.round(mins/60)} h`
              : d.toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
    // Le robot passe toutes les 15 min. Au-dela de 45 min sans relevé il
    // ne tourne plus (workflow desactive, en echec, ou quota) : on le dit,
    // plutot que d'afficher un compte a rebours faussement rassurant.
    const stale = mins > 45;
    $("#sub").innerHTML = `${nb(DATA.length)} annonces · relevé ${age}` + (stale
      ? ` · <b style="color:var(--accent)">robot à l'arrêt ?</b>`
      : ` · prochain dans ~${Math.max(0, 15 - (mins % 15))} min`);
    $("#foot").textContent =
      "« NOUVEAU » = première apparition dans le suivi (l'API Toyota ne publie pas " +
      "de date de mise en ligne). Prix en vert : sous le seuil d'alerte de " +
      eur(ALERT) + ".";
  } catch (e) {
    $("#sub").textContent = "Échec du chargement — appuie sur ↻";
  } finally {
    // Le telechargement prend ~150 ms : sans plancher, l'animation est trop
    // breve pour etre percue et l'appui semble sans effet.
    const reste = 500 - (performance.now() - t0);
    if (reste > 0) await new Promise(r => setTimeout(r, reste));
    loading = false;
    $("#refresh").classList.remove("busy");
  }
}
$("#refresh").addEventListener("click", () => load(true));

// iOS ne declenche pas visibilitychange de facon fiable quand on rouvre une
// app depuis l'ecran d'accueil : selon qu'elle a ete gelee, restauree depuis
// le cache de navigation ou relancee, c'est visibilitychange, pageshow ou
// focus qui part. On ecoute les trois, et un garde-fou de 30 s evite que
// trois evenements consecutifs declenchent trois requetes.
let lastLoad = 0;
function maybeLoad(){
  if (document.hidden) return;
  if (Date.now() - lastLoad < 30000) return;
  load();
}
document.addEventListener("visibilitychange", maybeLoad);
window.addEventListener("pageshow", maybeLoad);
window.addEventListener("focus", maybeLoad);

// Le robot passe toutes les 15 min : on se resynchronise pendant que la page
// reste ouverte, sans avoir a y toucher.
setInterval(maybeLoad, 3 * 60 * 1000);

// Tirer vers le bas pour actualiser (le geste natif n'existe pas en mode
// application ajoutee a l'ecran d'accueil).
let startY = null;
const pull = $("#pull");
addEventListener("touchstart", e => {
  startY = (scrollY <= 0) ? e.touches[0].clientY : null;
}, {passive: true});
addEventListener("touchmove", e => {
  if (startY === null) return;
  const dy = e.touches[0].clientY - startY;
  pull.classList.toggle("on", dy > 60);
}, {passive: true});
addEventListener("touchend", () => {
  if (pull.classList.contains("on")) { pull.classList.remove("on"); load(true); }
  startY = null;
}, {passive: true});

load();
</script>
</body>
</html>
